name: project_1
description: "Coin Catalog App with Firebase Integration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase Packages (aligned versions)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  url_launcher: ^6.1.10
  # State Management
  provider: ^6.1.1
  permission_handler: ^11.0.0
  # UI Components
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.5

  # Utilities
  image_picker: ^1.1.2
  intl: ^0.20.2
  photo_view: ^0.14.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
